# Pinned action SHAs never float, so Dependabot is what keeps them current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      dev-dependencies:
        dependency-type: development
    # @types/node tracks the oldest supported Node (engines.node), not the
    # newest; newer typings would accept APIs that line doesn't have.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
