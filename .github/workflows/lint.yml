name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'npm'
      - run: npm ci
      - name: Run ESLint
        run: npm run lint
      # The declarations are otherwise only built at publish time, so a broken
      # `exports` entry or a README example that no longer type-checks would
      # first be found by a user.
      - name: Check type declarations
        run: npm run test:types
