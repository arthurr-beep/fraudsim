name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: 'npm'
      - run: npm ci
      - name: Run ESLint
        run: npm run lint
      # The declarations are otherwise only built at publish time, so a broken
      # `exports` entry or a README example that no longer type-checks would
      # first be found by a user.
      - name: Check type declarations
        run: npm run test:types
