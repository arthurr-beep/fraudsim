name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full-history sweep, Mondays 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers every commit, not just the tip
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action is free for personal accounts and public repos.
          # If this repo ever moves under a GitHub *organization*, add a
          # GITLEAKS_LICENSE secret here.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
